name: Teleprompter
options:
  bundleIdPrefix: com.flashoot
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: RJNF5CMXY6 # change in Xcode > Signing & Capabilities if you use another team
    CODE_SIGN_STYLE: Automatic
targets:
  Teleprompter:
    type: application
    platform: iOS
    sources:
      - path: Teleprompter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flashoot.teleprompter
        PRODUCT_NAME: Teleprompter
        TARGETED_DEVICE_FAMILY: "2" # iPad only
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Teleprompter
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Lets your Mac or iPhone on the same Wi-Fi control the prompter from a web browser."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
